# Publishing to crates.io is outside what dist does, so it is wired in as a
# custom publish job (`publish-jobs` in dist-workspace.toml). dist calls this
# with `secrets: inherit` and the release plan as its only input, and skips it
# for prerelease tags.
#
# dist runs this in parallel with publish-docker, after the `host` job has already
# created the GitHub Release; it offers no way to order one custom publish job
# after another. That is survivable — the Release exists either way, and a failed
# image push is just a re-run — but it does mean this step is not a last resort.
# A crates.io version can only ever be yanked, never replaced or reused, so
# `just publish-check` before tagging is where a mistake is still cheap.
name: PublishCrates

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  cargo-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/package.json
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # This is `just vendor-bundle`. web/dist sits outside the package
      # directory, so a .crate tarball cannot reach it; craber-site's
      # `include = [... "bundle/**" ...]` is what ships the copy instead.
      #
      # Note what is deliberately *not* here: CRABER_WEB_DIST. Setting it would
      # make verification embed the bundle from an absolute path outside the
      # crate, which works and therefore hides the one thing worth checking —
      # that the published .crate can find its own bundle/. Leaving it unset
      # makes build.rs fall through to bundle/, which is the path a downstream
      # `cargo install craber` takes.
      - name: Vendor the web bundle into craber-site
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm build
          cd ..
          rm -rf crates/craber-site/bundle
          cp -R web/dist crates/craber-site/bundle
          rm -f crates/craber-site/bundle/schema.json

      # --workspace resolves the not-yet-published interdependencies against an
      # overlay of the locally built .crate files and waits out index
      # propagation, so the seven crates need no hand-written ordering.
      #
      # --allow-dirty is not optional: crates/craber-site/bundle is gitignored,
      # and cargo reports a package that sets `include` as dirty when gitignored
      # files are present. `just package-check` has always carried the same flag.
      #
      # No --locked: publish rewrites path deps into registry deps and resolves
      # against that overlay, so the committed lockfile is not the one it needs.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --allow-dirty
