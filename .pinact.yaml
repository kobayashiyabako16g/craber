# yaml-language-server: $schema=https://raw.githubusercontent.com/suzuki-shunsuke/pinact/refs/heads/main/json-schema/pinact.json
# pinact - https://github.com/suzuki-shunsuke/pinact
version: 3

# Two things pinact should leave alone, and without saying so it aborts partway
# through a `pinact run` over the whole directory.
rules:
  # dtolnay/rust-toolchain has no release tags at all — `@stable` is the
  # documented way to use it, and pinning it to a commit would mean pinning the
  # Rust version too.
  - ignore: true
    conditions:
      - expr: |
          ActionName == "dtolnay/rust-toolchain"

files:
  # .github/workflows/release.yml is generated by `dist generate`, which pins the
  # actions it emits itself. Editing it by hand is an error dist reports.
  - pattern: .github/workflows/ci.yml
  - pattern: .github/workflows/nix.yml
  - pattern: .github/workflows/publish-crates.yml
  - pattern: .github/workflows/publish-docker.yml
  # Not a workflow, but a list of steps dist injects into the generated one.
  - pattern: .github/build-setup.yml
