[package]
name         = "craber-site"
description  = "The deployable static site CrabER writes: the web bundle plus a schema.json"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
# Workspace inheritance is opt-in per key, so these have to be claimed here
# even though the values live in [workspace.package]. crates.io wants them.
repository.workspace   = true
keywords.workspace     = true
categories.workspace   = true
readme.workspace       = true

# `bundle/` is gitignored but has to ship: `include` overrides the VCS-ignore
# rules, and without it a published craber-site can never embed a frontend.
include = ["src/**", "build.rs", "bundle/**", "Cargo.toml"]

[dependencies]
craber-core = { workspace = true }

serde_json  = { workspace = true }
thiserror   = { workspace = true }

[lints]
workspace = true
