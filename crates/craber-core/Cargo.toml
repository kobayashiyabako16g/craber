[package]
name         = "craber-core"
description  = "CrabER schema IR: the normalized representation every output is rendered from"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
# Workspace inheritance is opt-in per key, so these have to be claimed here
# even though the values live in [workspace.package]. crates.io wants them.
repository.workspace   = true
keywords.workspace     = true
categories.workspace   = true
readme.workspace       = true

[dependencies]
serde     = { workspace = true }
globset   = { workspace = true }
thiserror = { workspace = true }
ts-rs     = { workspace = true }

[dev-dependencies]
insta      = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
