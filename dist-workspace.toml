[workspace]
members = ["cargo:."]

[dist]
# A concrete version, not a range: the generated release.yml bakes this release's
# installer URL in, so bumping it means re-running `dist generate`. nixpkgs
# carries 0.33.1 too, which is what the dev shell puts on PATH.
cargo-dist-version = "0.33.1"
ci = "github"
# Inferred from `ci` anyway, but stated so it is obvious no third-party hosting
# is involved (dist dropped Axo Releases in 0.29.0).
hosting = "github"

# Library-only crates are ignored automatically — dist only releases packages
# that define binaries. Naming `craber` anyway means a future xtask-style binary
# cannot quietly end up in a release.
packages = ["craber"]

# musl rather than gnu on Linux: the binary is then static — a single file that
# runs on any distribution — and that is what lets the Docker image be
# distroless/static with nothing else in it.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

installers = ["shell", "powershell"]

# The web bundle is compiled into the binary, so the frontend has to exist
# before `cargo build` runs. dist has no "run once, before the matrix"
# phase, so these steps are injected at the top of every build job instead.
# The path is relative to .github/workflows/, and the file deliberately lives
# outside that directory so GitHub does not read it as a workflow of its own.
github-build-setup = "../build-setup.yml"

# Neither is something dist does itself. Both are reusable workflows that take
# the plan JSON; see .github/workflows/publish-*.yml. dist runs them in parallel
# after the release exists — there is no way to order one after the other.
publish-jobs = ["./publish-crates", "./publish-docker"]

# Builds the full matrix on pull requests and attaches the artifacts to the run,
# which is the only way to exercise this pipeline without cutting a release.
#
# This is not a permanent setting. It means every pull request compiles all four
# targets, and on a private repository the macOS leg bills at ten times the rate.
# Set it back to "plan" — plan only, no builds — once the pipeline has been seen
# to work end to end.
pr-run-mode = "upload"

# dist gives custom publish jobs `id-token: write` and `packages: write` by
# default, and a job that names any permission gets `none` for every one it does
# not name — which would leave both of these unable to check the repository out.
# Overriding replaces the defaults outright, so each line here is the complete
# set. Keys carry no `./`. This table is last because everything after a TOML
# table header belongs to it.
[dist.github-custom-job-permissions]
# Checkout only. crates.io is reached with CARGO_REGISTRY_TOKEN, not OIDC, so no
# id-token; nothing is written back, so no contents: write.
publish-crates = { contents = "read" }
# Checkout, plus `gh release download` to fetch the musl binaries dist just
# built, plus pushing the image to GHCR.
publish-docker = { contents = "read", packages = "write" }
